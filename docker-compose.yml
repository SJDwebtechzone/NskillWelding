services:
  db:
    image: postgres:16-alpine
    container_name: niw-postgres
    environment:
      POSTGRES_USER: niw
      POSTGRES_PASSWORD: niw_password
      POSTGRES_DB: niw_knowledge
    ports:
      - "5432:5432"
    volumes:
      - niw_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./database/seed_home.sql:/docker-entrypoint-initdb.d/03-seed-home.sql
      - ./database/seed_pages.sql:/docker-entrypoint-initdb.d/04-seed-pages.sql
volumes:
  niw_pgdata:
